spring:
  application:
    name: member-service

  datasource:
    url: jdbc:postgresql://localhost:5432/member_db
    username: member
    password: member1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: never

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters}
  access-token-expiry: 1800
  refresh-token-expiry: 1209600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
