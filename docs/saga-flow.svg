<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43A047"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E53935"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FB8C00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="460" fill="#FAFAFA" rx="10"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#212121">Choreography Saga 흐름</text>

  <!-- ── Service Boxes ── -->
  <!-- Order Service -->
  <rect x="50" y="55" width="160" height="64" rx="10" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Order Service</text>
  <text x="130" y="102" text-anchor="middle" font-size="11" fill="#BBDEFB">주문 생성 / 관리</text>

  <!-- Stock Service -->
  <rect x="510" y="55" width="160" height="64" rx="10" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
  <text x="590" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Stock Service</text>
  <text x="590" y="102" text-anchor="middle" font-size="11" fill="#C8E6C9">재고 차감 / 복구</text>

  <!-- Lifelines -->
  <line x1="130" y1="119" x2="130" y2="400" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="590" y1="119" x2="590" y2="400" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Kafka label (center top) -->
  <rect x="275" y="55" width="170" height="30" rx="6" fill="#FF6D00" stroke="#E65100" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Apache Kafka (이벤트 버스)</text>

  <!-- ── Step 1: order.created ── -->
  <text x="160" y="160" text-anchor="middle" font-size="10" fill="#555">① 주문 생성</text>
  <line x1="142" y1="170" x2="578" y2="170" stroke="#2196F3" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="260" y="154" width="200" height="22" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.2"/>
  <text x="360" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">order.created</text>

  <!-- ── Divider: success vs fail ── -->
  <line x1="360" y1="205" x2="360" y2="340" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="220" text-anchor="middle" font-size="10" fill="#43A047" font-weight="bold">✔ 재고 충분</text>
  <text x="460" y="275" text-anchor="middle" font-size="10" fill="#E53935" font-weight="bold">✘ 재고 부족</text>

  <!-- ── Step 2a: stock.reserved (success) ── -->
  <line x1="578" y1="240" x2="142" y2="240" stroke="#43A047" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="260" y="224" width="200" height="22" rx="5" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="360" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">stock.reserved</text>
  <rect x="55" y="248" width="105" height="20" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="107" y="262" text-anchor="middle" font-size="10" fill="#2E7D32">→ CONFIRMED ✓</text>

  <!-- ── Step 2b: stock.failed (failure) ── -->
  <line x1="578" y1="295" x2="142" y2="295" stroke="#E53935" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#arr-red)"/>
  <rect x="260" y="279" width="200" height="22" rx="5" fill="#FFEBEE" stroke="#E53935" stroke-width="1.2"/>
  <text x="360" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">stock.failed</text>
  <rect x="55" y="303" width="115" height="20" rx="4" fill="#FFEBEE" stroke="#E53935" stroke-width="1"/>
  <text x="112" y="317" text-anchor="middle" font-size="10" fill="#C62828">→ CANCELLED ✗</text>

  <!-- ── Step 3: order.cancelled (compensation) ── -->
  <text x="170" y="350" text-anchor="middle" font-size="10" fill="#FB8C00">③ 보상 트랜잭션</text>
  <line x1="142" y1="360" x2="578" y2="360" stroke="#FB8C00" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#arr-orange)"/>
  <rect x="255" y="344" width="210" height="22" rx="5" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.2"/>
  <text x="360" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">order.cancelled</text>
  <rect x="535" y="368" width="110" height="20" rx="4" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1"/>
  <text x="590" y="382" text-anchor="middle" font-size="10" fill="#E65100">재고 복구 (보상)</text>

  <!-- ── Legend ── -->
  <rect x="50" y="415" width="620" height="32" rx="7" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="70" y1="431" x2="100" y2="431" stroke="#2196F3" stroke-width="2"/>
  <text x="106" y="435" font-size="10" fill="#555">정상 흐름</text>
  <line x1="185" y1="431" x2="215" y2="431" stroke="#43A047" stroke-width="2"/>
  <text x="221" y="435" font-size="10" fill="#555">재고 성공</text>
  <line x1="300" y1="431" x2="330" y2="431" stroke="#E53935" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="336" y="435" font-size="10" fill="#555">재고 부족</text>
  <line x1="415" y1="431" x2="445" y2="431" stroke="#FB8C00" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="451" y="435" font-size="10" fill="#555">보상 트랜잭션</text>
  <rect x="548" y="424" width="110" height="16" rx="4" fill="#FF6D00" opacity="0.15" stroke="#FF6D00" stroke-width="1"/>
  <text x="603" y="435" text-anchor="middle" font-size="10" fill="#E65100">Kafka 경유</text>
</svg>
