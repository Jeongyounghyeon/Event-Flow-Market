spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: member-service
              uri: ${MEMBER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/members/**

            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

            - id: stock-service
              uri: ${STOCK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/stocks/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: logstash
