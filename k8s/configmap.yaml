apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: event-flow-market
data:
  # bitnami Helm 차트 서비스명: <release-name>-postgresql, redis-master, kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis-master"
  MEMBER_DB_URL: "jdbc:postgresql://member-db-postgresql:5432/member_db"
  ORDER_DB_URL: "jdbc:postgresql://order-db-postgresql:5432/order_db"
  STOCK_DB_URL: "jdbc:postgresql://stock-db-postgresql:5432/stock_db"
  MEMBER_SERVICE_URI: "http://member-service:8081"
  ORDER_SERVICE_URI: "http://order-service:8082"
  STOCK_SERVICE_URI: "http://stock-service:8083"